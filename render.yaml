services:
  - type: web
    name: xe3agle-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: xe3agle-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://YOUR-APP.vercel.app
      - key: APP_URL
        value: https://YOUR-APP.vercel.app
      - key: SMTP_HOST
        value: ""
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: ""
      - key: SMTP_PASS
        value: ""
      - key: GOOGLE_CLIENT_ID
        value: ""

databases:
  - name: xe3agle-db
    databaseName: xe3agle
    user: xe3agle
    plan: free
